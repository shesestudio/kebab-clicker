<!DOCTYPE html>
<html>
<head>
<title>kebab clicker</title>
<style>
body {
    background: #ffcc00;
    font-family: "Comic Sans MS", cursive;
    text-align: center;
    margin: 0;
    padding: 20px;
}
h1 {
    color: red;
    font-size: 40px;
    text-shadow: 3px 3px 0 black;
}
#kebab {
    font-size: 150px;
    cursor: pointer;
    user-select: none;
    display: inline-block;
}
.licznik {
    background: white;
    border: 4px solid black;
    color: black;
    font-size: 30px;
    padding: 10px;
    display: inline-block;
    margin: 5px;
    font-weight: bold;
}
button {
    font-family: "Comic Sans MS", cursive;
    font-size: 18px;
    background: lime;
    border: 3px solid black;
    padding: 10px;
    margin: 5px;
    cursor: pointer;
    font-weight: bold;
}
button:disabled {
    background: gray;
    color: #333;
    cursor: not-allowed;
}
button.max {
    background: orange;
}
button.reset {
    background: red;
    color: white;
}
.info {
    color: black;
    font-size: 18px;
    font-weight: bold;
}
#log {
    background: white;
    border: 3px solid black;
    padding: 5px;
    height: 70px;
    overflow-y: auto;
    font-family: "Courier New", monospace;
    font-size: 13px;
    text-align: left;
    margin: 15px auto;
    max-width: 500px;
}
</style>
</head>
<body>

<h1>🌯 KEBAB CLICKER 🌯</h1>

<div class="licznik">KEBABY: <span id="score">0</span></div><br>
<div class="licznik" style="font-size:18px;">ZA KLIK: <span id="perClick">1</span></div>
<div class="licznik" style="font-size:18px;">AUTO: <span id="auto">0</span>/s</div>

<br>
<div id="kebab">🌯</div>
<br>

<p class="info">klikaj kebaba zeby zdobyc kebaby</p>

<button id="b1">+1 za klik - 10</button>
<button id="b2">+5 za klik - 100</button><br>
<button id="b3">auto +1/s - 50</button>
<button id="b4">auto +5/s - 500</button><br>
<button id="b5">auto +20/s - 2000</button>

<br><br>
<button id="maxClick" class="max">MAX ZA KLIK (kup ile stac)</button>
<button id="maxAuto" class="max">MAX AUTO (kup ile stac)</button>
<br>
<button id="resetBtn" class="reset">RESETUJ ZAPIS</button>

<div id="log">> siema to jest kebab clicker<br>> klikaj kebaba</div>

<script>
// ---------- STAN GRY ----------
let kebaby = 0;
let zaKlik = 1;
let auto = 0;

// ---------- ELEMENTY ----------
let score = document.getElementById('score');
let perClick = document.getElementById('perClick');
let autoEl = document.getElementById('auto');
let log = document.getElementById('log');
let kebab = document.getElementById('kebab');

// ---------- LOG ----------
function logMsg(txt) {
    log.innerHTML += '> ' + txt + '<br>';
    log.scrollTop = log.scrollHeight;
}

// ---------- ZAPIS / WCZYTANIE ----------
function zapisz() {
    const dane = {
        kebaby: kebaby,
        zaKlik: zaKlik,
        auto: auto
    };
    localStorage.setItem('kebabClickerSave', JSON.stringify(dane));
}

function wczytaj() {
    const surowe = localStorage.getItem('kebabClickerSave');
    if (!surowe) return false;
    try {
        const dane = JSON.parse(surowe);
        kebaby = dane.kebaby || 0;
        zaKlik = dane.zaKlik || 1;
        auto = dane.auto || 0;
        return true;
    } catch (e) {
        return false;
    }
}

function resetZapisu() {
    if (confirm('Na pewno zresetowac caly zapis?')) {
        localStorage.removeItem('kebabClickerSave');
        kebaby = 0;
        zaKlik = 1;
        auto = 0;
        log.innerHTML = '> zapis zresetowany<br>';
        update();
        logMsg('zaczynasz od nowa!');
    }
}

// ---------- KLIK ----------
kebab.onclick = function() {
    kebaby += zaKlik;
    update();
    zapisz();
};

// ---------- SKLEP ----------
document.getElementById('b1').onclick = () => {
    if (kebaby >= 10) { kebaby -= 10; zaKlik += 1; logMsg('kupiles +1 za klik'); update(); zapisz(); }
};
document.getElementById('b2').onclick = () => {
    if (kebaby >= 100) { kebaby -= 100; zaKlik += 5; logMsg('kupiles +5 za klik'); update(); zapisz(); }
};
document.getElementById('b3').onclick = () => {
    if (kebaby >= 50) { kebaby -= 50; auto += 1; logMsg('kupiles auto +1/s'); update(); zapisz(); }
};
document.getElementById('b4').onclick = () => {
    if (kebaby >= 500) { kebaby -= 500; auto += 5; logMsg('kupiles auto +5/s'); update(); zapisz(); }
};
document.getElementById('b5').onclick = () => {
    if (kebaby >= 2000) { kebaby -= 2000; auto += 20; logMsg('kupiles auto +20/s'); update(); zapisz(); }
};

// ---------- MAX ZA KLIK ----------
// kupuje najdrozszy mozliwy ulepszenie za klik, powtarza az stac
document.getElementById('maxClick').onclick = () => {
    let kupiono = 0;
    let zmiana = true;
    while (zmiana) {
        zmiana = false;
        if (kebaby >= 100) {          // b2: +5 za 100
            kebaby -= 100; zaKlik += 5; kupiono++; zmiana = true;
        } else if (kebaby >= 10) {    // b1: +1 za 10
            kebaby -= 10; zaKlik += 1; kupiono++; zmiana = true;
        }
    }
    if (kupiono > 0) {
        logMsg('MAX ZA KLIK: kupiono ' + kupiono + ' ulepszen');
        update(); zapisz();
    } else {
        logMsg('nie stac cie na nic za klik');
    }
};

// ---------- MAX AUTO ----------
document.getElementById('maxAuto').onclick = () => {
    let kupiono = 0;
    let zmiana = true;
    while (zmiana) {
        zmiana = false;
        if (kebaby >= 2000) {         // b5: +20/s za 2000
            kebaby -= 2000; auto += 20; kupiono++; zmiana = true;
        } else if (kebaby >= 500) {   // b4: +5/s za 500
            kebaby -= 500; auto += 5; kupiono++; zmiana = true;
        } else if (kebaby >= 50) {    // b3: +1/s za 50
            kebaby -= 50; auto += 1; kupiono++; zmiana = true;
        }
    }
    if (kupiono > 0) {
        logMsg('MAX AUTO: kupiono ' + kupiono + ' ulepszen');
        update(); zapisz();
    } else {
        logMsg('nie stac cie na nic auto');
    }
};

// ---------- RESET ----------
document.getElementById('resetBtn').onclick = resetZapisu;

// ---------- UPDATE ----------
function update() {
    score.textContent = kebaby;
    perClick.textContent = zaKlik;
    autoEl.textContent = auto;
    document.getElementById('b1').disabled = kebaby < 10;
    document.getElementById('b2').disabled = kebaby < 100;
    document.getElementById('b3').disabled = kebaby < 50;
    document.getElementById('b4').disabled = kebaby < 500;
    document.getElementById('b5').disabled = kebaby < 2000;
    document.getElementById('maxClick').disabled = kebaby < 10;
    document.getElementById('maxAuto').disabled = kebaby < 50;
}

// ---------- AUTO PRZYCHÓD ----------
setInterval(() => {
    if (auto > 0) {
        kebaby += auto;
        update();
        zapisz();
    }
}, 1000);

// ---------- START ----------
const wczytano = wczytaj();
if (wczytano) {
    logMsg('wczytano zapis!');
} else {
    logMsg('nowa gra - powodzenia!');
}
update();
</script>

</body>
</html>
